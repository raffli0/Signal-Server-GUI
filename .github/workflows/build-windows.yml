name: Build Windows Standalone Installer

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Configure Git for Windows
      run: git config --global core.protectNTFS false

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up MSYS2 MinGW-w64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-spdlog
          mingw-w64-x86_64-bzip2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-gdal

    - name: Compile Signal-Server C++ Engines (MinGW-w64)
      shell: msys2 {0}
      run: |
        ROOT_DIR="$(pwd)"
        mkdir -p Signal-Server/build
        cd Signal-Server/build
        cmake -G Ninja ../src
        ninja
        cd "$ROOT_DIR"

        mkdir -p Signal-Server/utils/sdf/usgs2sdf/build
        cd Signal-Server/utils/sdf/usgs2sdf/build
        cmake -G Ninja ..
        ninja
        cd "$ROOT_DIR"

        mkdir -p bin
        cp Signal-Server/build/*.exe bin/
        cp Signal-Server/utils/sdf/usgs2sdf/build/*.exe bin/

        # Copy runtime dependencies from MinGW64
        cp /mingw64/bin/libbz2*.dll bin/ || true
        cp /mingw64/bin/zlib1.dll bin/ || true
        cp /mingw64/bin/libwinpthread*.dll bin/ || true
        cp /mingw64/bin/libgcc_s*.dll bin/ || true
        cp /mingw64/bin/libstdc++*.dll bin/ || true
        cp /mingw64/bin/libspdlog*.dll bin/ || true
        cp /mingw64/bin/libfmt*.dll bin/ || true

        # Copy GDAL CLI executables and primary DLLs to bin/
        cp /mingw64/bin/gdal*.exe bin/ || true
        cp /mingw64/bin/gdal*.dll bin/ || true
        cp /mingw64/bin/libgdal*.dll bin/ || true

        # Copy PROJ and GDAL datum/definition databases
        mkdir -p bin/gdal_data bin/proj
        cp -r /mingw64/share/gdal/* bin/gdal_data/ 2>/dev/null || true
        cp -r /mingw64/share/proj/* bin/proj/ 2>/dev/null || true

        # Iteratively copy all transitive DLL dependencies for executables and DLLs
        echo "Resolving all transitive DLL dependencies..."
        for pass in 1 2 3 4 5 6; do
          NEW_COPIED=0
          for f in bin/*.exe bin/*.dll; do
            if [ -f "$f" ]; then
              for dll in $(ldd "$f" 2>/dev/null | grep '/mingw64/bin/' | awk '{print $3}'); do
                if [ -f "$dll" ]; then
                  base=$(basename "$dll")
                  if [ ! -f "bin/$base" ]; then
                    cp "$dll" bin/
                    NEW_COPIED=$((NEW_COPIED + 1))
                  fi
                fi
              done
            fi
          done
          echo "Pass $pass copied $NEW_COPIED new DLLs"
          if [ "$NEW_COPIED" -eq 0 ]; then
            break
          fi
        done

        # Mirror GDAL tools and DLLs to bin/gdal/ so both bin/ and bin/gdal/ are 100% self-contained
        mkdir -p bin/gdal
        cp bin/gdal*.exe bin/gdal/ 2>/dev/null || true
        cp bin/*.dll bin/gdal/ 2>/dev/null || true

    - name: Install Python Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ./gui
        python -m pip install pyinstaller

    - name: Bundle Standalone Application
      run: |
        python scripts/package_windows.py

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Compile Windows Installer (Inno Setup)
      run: |
        if (Get-Command iscc -ErrorAction SilentlyContinue) {
          iscc scripts/installer.iss
        } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts/installer.iss
        } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
          & "C:\Program Files\Inno Setup 6\ISCC.exe" scripts/installer.iss
        } else {
          Write-Error "ISCC compiler not found!"
          exit 1
        }

    - name: Upload Windows Standalone Folder Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SignalServerGUI-Windows-Portable
        path: dist/SignalServerGUI/

    - name: Upload Windows Installer Setup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SignalServerGUI-Setup
        path: dist-installer/*.exe
