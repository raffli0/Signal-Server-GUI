name: Build Windows Standalone Installer

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Configure Git for Windows
      run: git config --global core.protectNTFS false

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'gui/pyproject.toml'

    - name: Cache Signal-Server C++ Binaries & GDAL
      id: cache-cpp-bin
      uses: actions/cache@v4
      with:
        path: bin
        key: cpp-bin-${{ runner.os }}-${{ hashFiles('Signal-Server/**', '.github/workflows/build-windows.yml') }}

    - name: Set up MSYS2 MinGW-w64
      if: steps.cache-cpp-bin.outputs.cache-hit != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-spdlog
          mingw-w64-x86_64-bzip2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-gdal

    - name: Compile Signal-Server C++ Engines (MinGW-w64)
      if: steps.cache-cpp-bin.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        set -e
        ROOT_DIR="$(pwd)"

        mkdir -p Signal-Server/build
        cd Signal-Server/build
        cmake -G Ninja ../src
        ninja

        if [ ! -f "signalserver.exe" ]; then
          echo "ERROR: signalserver.exe was not created in Signal-Server/build!"
          ls -la
          exit 1
        fi
        cd "$ROOT_DIR"

        mkdir -p Signal-Server/utils/sdf/usgs2sdf/build
        cd Signal-Server/utils/sdf/usgs2sdf/build
        cmake -G Ninja ..
        ninja
        cd "$ROOT_DIR"

        mkdir -p bin
        cp Signal-Server/build/*.exe bin/
        cp Signal-Server/utils/sdf/usgs2sdf/build/*.exe bin/

        # Copy runtime dependencies from MinGW64
        cp /mingw64/bin/libbz2*.dll bin/ || true
        cp /mingw64/bin/zlib1.dll bin/ || true
        cp /mingw64/bin/libwinpthread*.dll bin/ || true
        cp /mingw64/bin/libgcc_s*.dll bin/ || true
        cp /mingw64/bin/libstdc++*.dll bin/ || true
        cp /mingw64/bin/libspdlog*.dll bin/ || true
        cp /mingw64/bin/libfmt*.dll bin/ || true

        # Copy GDAL CLI executables and primary DLLs to bin/
        cp /mingw64/bin/gdal*.exe bin/ || true
        cp /mingw64/bin/gdal*.dll bin/ || true
        cp /mingw64/bin/libgdal*.dll bin/ || true

        # Copy PROJ and GDAL datum/definition databases
        mkdir -p bin/gdal_data bin/proj
        cp -r /mingw64/share/gdal/* bin/gdal_data/ 2>/dev/null || true
        cp -r /mingw64/share/proj/* bin/proj/ 2>/dev/null || true

        # Iteratively copy all transitive DLL dependencies for executables and DLLs
        echo "Resolving all transitive DLL dependencies..."
        for pass in 1 2 3 4 5 6; do
          NEW_COPIED=0
          for f in bin/*.exe bin/*.dll; do
            if [ -f "$f" ]; then
              for dll in $(ldd "$f" 2>/dev/null | grep '/mingw64/bin/' | awk '{print $3}'); do
                if [ -f "$dll" ]; then
                  base=$(basename "$dll")
                  if [ ! -f "bin/$base" ]; then
                    cp "$dll" bin/
                    NEW_COPIED=$((NEW_COPIED + 1))
                  fi
                fi
              done
            fi
          done
          echo "Pass $pass copied $NEW_COPIED new DLLs"
          if [ "$NEW_COPIED" -eq 0 ]; then
            break
          fi
        done

        # Mirror GDAL tools and DLLs to bin/gdal/ so both bin/ and bin/gdal/ are 100% self-contained
        mkdir -p bin/gdal
        cp bin/gdal*.exe bin/gdal/ 2>/dev/null || true
        cp bin/*.dll bin/gdal/ 2>/dev/null || true

    - name: Verify C++ Engines & Runtime Dependencies
      run: |
        if (!(Test-Path "bin\signalserver.exe")) {
          Write-Error "bin/signalserver.exe is missing! Check build or cache."
          exit 1
        }
        Write-Host "C++ engine binaries and GDAL dependencies verified successfully in bin/."
        Get-ChildItem bin\*.exe | Select-Object Name, Length

    - name: Install Python Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ./gui
        python -m pip install pyinstaller

    - name: Bundle Standalone Application
      run: |
        python scripts/package_windows.py

    - name: Create Lightweight GUI Update Patch Files
      run: |
        New-Item -ItemType Directory -Force -Path dist-patch\patch\signal_gui
        Copy-Item -Path gui\src\signal_gui\* -Destination dist-patch\patch\signal_gui -Recurse
        Compress-Archive -Path dist-patch\patch -DestinationPath dist-patch\SignalServerGUI-Patch.zip -Force
        $size = (Get-Item dist-patch\SignalServerGUI-Patch.zip).Length / 1MB
        Write-Host "Real Lightweight GUI Patch ZIP created ($([math]::Round($size, 2)) MB) at dist-patch\SignalServerGUI-Patch.zip"

    - name: Cache Inno Setup
      id: cache-inno
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\Inno Setup 6
        key: inno-setup-6

    - name: Install Inno Setup
      run: |
        if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and !(Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
          choco install innosetup --no-progress
        } else {
          Write-Host "Inno Setup compiler found and ready."
        }

    - name: Compile Windows Installers (Full Setup & Update Patch)
      run: |
        $iscc = ""
        if (Get-Command iscc -ErrorAction SilentlyContinue) {
          $iscc = "iscc"
        } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
          $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
        } else {
          Write-Error "ISCC compiler not found!"
          exit 1
        }
        Write-Host "Compiling Full Setup Installer (SignalServerGUI-Setup.exe)..."
        & $iscc scripts/installer.iss

        Write-Host "Compiling Lightweight Update Patch Installer (SignalServerGUI-Update.exe)..."
        & $iscc scripts/patch_installer.iss

    - name: Upload Windows Standalone Folder Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SignalServerGUI-Windows-Portable
        path: dist/SignalServerGUI/

    - name: Upload Windows Full Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SignalServerGUI-Setup
        path: dist-installer/SignalServerGUI-Setup.exe

    - name: Upload Windows Update Patch Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SignalServerGUI-Update
        path: dist-installer/SignalServerGUI-Update.exe

    - name: Upload Lightweight GUI Patch ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SignalServerGUI-Patch-Zip
        path: dist-patch/SignalServerGUI-Patch.zip
