[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-gui"
version = "0.1.0"
description = "Modern PySide6 GUI for the Signal-Server RF propagation engine"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "pyproj",
    "mgrs",
    "Pillow",
    "numpy",
    "scipy",
]

[project.scripts]
signal-gui = "signal_gui.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_gui = ["resources/*.html", "resources/*.dcf", "resources/rm/*.png", "resources/rm/*.dat"]

[tool.pytest.ini_options]
markers = [
    "integration: runs the real Signal-Server binary (requires built engine)",
]
